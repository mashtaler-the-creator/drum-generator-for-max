<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum Generator</title>
<style>
  :root {
    --bg: #16181d; --panel: #1f2229; --line: #2e323b;
    --text: #e8eaf0; --dim: #9aa1ae; --accent: #ffb43a; --accent2: #4fc3f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 20px; font-size: 12.5px; }
  .app { width: 100%; max-width: 860px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 14px;
  }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  label { display: block; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  select, input[type=number] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 8px; font-size: 14px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .rangeval { color: var(--accent); font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  button {
    border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; background: var(--line); color: var(--text);
  }
  button:hover { filter: brightness(1.15); }
  #btnNew { background: var(--accent); color: #1a1200; }
  #btnPlay { background: var(--accent2); color: #002233; min-width: 96px; }
  #btnDownload { background: #3ddc84; color: #00220f; }
  .seed { color: var(--dim); font-size: 12.5px; margin-left: auto; }
  .seed b { color: var(--text); font-variant-numeric: tabular-nums; }
  #grid { width: 100%; height: auto; display: block; border-radius: 6px; background: var(--bg); }
  .legend { color: var(--dim); font-size: 12px; margin-top: 8px; }
  #status { color: var(--dim); font-size: 12.5px; min-height: 18px; margin-top: 6px; }
  .loopwrap { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <h1>DRUM <span>GENERATOR</span></h1>
  <p class="sub">Generate a beat, listen with the built-in preview kit, download the .mid and drop it on your Drum Rack in Live.</p>

  <div class="panel">
    <div class="controls">
      <div><label>Pattern</label><select id="pattern"></select></div>
      <div><label>Feel preset</label><select id="preset"></select></div>
      <div><label>Bars</label><input type="number" id="bars" min="1" max="64" value="8"></div>
      <div><label>BPM</label><input type="number" id="bpm" min="40" max="300" value="172"></div>
      <div><label>Density <span class="rangeval" id="densityVal">1.00</span></label>
        <input type="range" id="density" min="0.3" max="1" step="0.05" value="1"></div>
      <div><label>Ghosts <span class="rangeval" id="ghostsVal">preset</span></label>
        <input type="range" id="ghosts" min="0" max="0.25" step="0.01" value="-0.01"></div>
    </div>
    <div class="buttons">
      <button id="btnNew">🎲 New variation</button>
      <button id="btnPlay">▶ Play</button>
      <button id="btnDownload">⬇ Download .mid</button>
      <span class="loopwrap"><input type="checkbox" id="loop" checked> loop</span>
      <span class="seed">seed <b id="seedVal">–</b></span>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel">
    <canvas id="grid" width="1660" height="440"></canvas>
    <div class="legend">Row brightness = velocity. Preview sounds are synthesized approximations — your Drum Rack samples will sound better.</div>
  </div>
</div>

  if (!pattern) throw new Error(`Pattern "${q.get("pattern")}" not found`);
  const presetName = q.get("preset") || "tight";
  const overrides = Object.assign({}, D.presets[presetName]);
  delete overrides._desc;
  if (q.get("density") !== null) overrides.density = parseFloat(q.get("density"));
  if (q.get("ghosts") !== null) overrides.ghostProbability = parseFloat(q.get("ghosts"));
  const state = D.lib.engine.makeState(pattern, D.mapping, overrides);
  const fillPatterns = D.patterns.filter(
    (p) => p.style === pattern.style && (p.tags || []).includes("fill") && p.id !== pattern.id
  );
  const bars = Math.min(64, Math.max(1, parseInt(q.get("bars") || "8", 10)));
  const bpm = Math.min(300, Math.max(40, parseInt(q.get("bpm") || pattern.bpm || "172", 10)));
  const seed = q.get("seed") !== null ? parseInt(q.get("seed"), 10) : undefined;
  const events = D.lib.engine.render(state, bars, { fillPatterns, seed });
  return { events, bars, bpm, patternId: pattern.id, presetName, ppq: D.lib.PPQ };
}

async function apiRender(q) {
  if (IS_STATIC) return staticRender(q);
  return (await fetch("/api/render?" + q)).json();
}

function apiDownload(q) {
  if (!IS_STATIC) { window.location = "/api/render.mid?" + q; return; }
  const r = staticRender(q);
  const midi = window.STATIC_DATA.lib.eventsToMidi(r.events, { bpm: r.bpm });
  const blob = new Blob([midi], { type: "audio/midi" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${r.patternId}_${r.bars}bars_${r.bpm}bpm.mid`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function params() {
  const p = new URLSearchParams({
    pattern: $("pattern").value,
    preset: $("preset").value,
    bars: $("bars").value,
    bpm: $("bpm").value,
    density: $("density").value,
    seed: String(seed),
  });
  if (parseFloat($("ghosts").value) >= 0) p.set("ghosts", $("ghosts").value);
  return p;
}

async function rerender() {
  stop();
  let data;
  try {
    data = await apiRender(params());
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
    return;
  }
  if (data.error) { $("status").textContent = "Error: " + data.error; return; }
  CUR = data;
  $("seedVal").textContent = seed;
  $("status").textContent = `${data.events.length} notes · ${data.bars} bars @ ${data.bpm} bpm · ${data.patternId} / ${data.presetName}`;
  drawGrid();
}

// ------------------------------------------------------------- grid drawing
const ROLE_ORDER = ["crash","ride","openHat","hihat","shaker","tambourine","clave","cowbell","congaHigh","congaLow","perc","tomHigh","tomMid","tomLow","clap","rim","snare","kick"];
function drawGrid(playTick) {
  const cv = $("grid"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!CUR) return;
  const roles = ROLE_ORDER.filter((r) => CUR.events.some((e) => e.role === r));
  const totalTicks = CUR.bars * 4 * CUR.ppq;
  const left = 90, w = cv.width - left - 10, rowH = cv.height / Math.max(roles.length, 1);
  ctx.font = "20px sans-serif";
  roles.forEach((r, i) => {
    ctx.fillStyle = "#9aa1ae";
    ctx.fillText(r, 6, i * rowH + rowH / 2 + 7);
    ctx.strokeStyle = "#2e323b"; ctx.beginPath();
    ctx.moveTo(left, (i + 1) * rowH); ctx.lineTo(cv.width - 10, (i + 1) * rowH); ctx.stroke();
  });
  for (let bar = 0; bar <= CUR.bars; bar++) {
    const x = left + (bar * 4 * CUR.ppq / totalTicks) * w;
    ctx.strokeStyle = bar % 4 === 0 ? "#454b58" : "#2e323b";
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke();
  }
  for (const e of CUR.events) {
    const i = roles.indexOf(e.role);
    const x = left + (e.startTick / totalTicks) * w;
    const bw = Math.max(3, (e.durationTick / totalTicks) * w * 0.8);
    const a = 0.25 + 0.75 * (e.velocity / 127);
    ctx.fillStyle = e.role === "kick" || e.role === "snare"
      ? `rgba(255,180,58,${a})` : `rgba(79,195,247,${a})`;
    ctx.fillRect(x, i * rowH + 5, bw, rowH - 10);
  }
  if (playTick !== undefined) {
    const x = left + (playTick / totalTicks) * w;
    ctx.strokeStyle = "#ff5f5f"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// ---------------------------------------------------------- WebAudio drum kit
let ac = null;
function noiseBuf() {
  const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
let NOISE = null;
function env(t, peak, dur) {
  const g = ac.createGain();
  g.gain.setValueAtTime(peak, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  g.connect(ac.destination);
  return g;
}
function noise(t, peak, dur, type, freq, q) {
  const src = ac.createBufferSource(); src.buffer = NOISE; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  if (q) f.Q.value = q;
  src.connect(f); f.connect(env(t, peak, dur));
  src.start(t); src.stop(t + dur + 0.02);
}
function tone(t, peak, dur, type, f0, f1) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8);
  o.connect(env(t, peak, dur));
  o.start(t); o.stop(t + dur + 0.02);
}
const KIT = {
  kick:      (t, v) => { tone(t, v * 1.1, 0.32, "sine", 118, 42); noise(t, v * 0.25, 0.02, "lowpass", 4000); },
  snare:     (t, v) => { noise(t, v * 0.8, 0.16, "highpass", 1400); tone(t, v * 0.5, 0.1, "triangle", 192, 130); },
  rim:       (t, v) => { noise(t, v * 0.6, 0.035, "bandpass", 1700, 4); tone(t, v * 0.3, 0.02, "square", 1050); },
  clap:      (t, v) => { for (let i = 0; i < 3; i++) noise(t + i * 0.009, v * 0.6, 0.09, "bandpass", 1250, 2); },
  perc:      (t, v) => { for (let i = 0; i < 3; i++) noise(t + i * 0.009, v * 0.6, 0.09, "bandpass", 1250, 2); },
  hihat:     (t, v) => noise(t, v * 0.5, 0.045, "highpass", 7500),
  openHat:   (t, v, d) => noise(t, v * 0.5, Math.min(Math.max(d, 0.08), 0.5), "highpass", 7200),
  crash:     (t, v) => noise(t, v * 0.7, 1.1, "highpass", 5200),
  ride:      (t, v) => { noise(t, v * 0.35, 0.4, "highpass", 6500); tone(t, v * 0.2, 0.25, "sine", 520); },
  tomLow:    (t, v) => tone(t, v * 0.9, 0.28, "sine", 105, 70),
  tomMid:    (t, v) => tone(t, v * 0.9, 0.26, "sine", 145, 95),
  tomHigh:   (t, v) => tone(t, v * 0.9, 0.24, "sine", 195, 130),
  tambourine:(t, v) => { noise(t, v * 0.4, 0.1, "bandpass", 8000, 1.5); noise(t + 0.02, v * 0.25, 0.08, "bandpass", 8500, 1.5); },
  cowbell:   (t, v) => { tone(t, v * 0.4, 0.14, "square", 560); tone(t, v * 0.3, 0.14, "square", 845); },
  congaHigh: (t, v) => tone(t, v * 0.7, 0.14, "sine", 310, 240),
  congaLow:  (t, v) => tone(t, v * 0.7, 0.16, "sine", 220, 165),
  shaker:    (t, v) => noise(t, v * 0.35, 0.07, "bandpass", 5600, 1.2),
  clave:     (t, v) => tone(t, v * 0.5, 0.05, "sine", 1180),
};

// ----------------------------------------------------------------- transport
let playing = false, startTime = 0, schedTick = 0, timer = null, raf = null;
function tick2sec(t) { return t * 60 / (CUR.bpm * CUR.ppq); }
function scheduler() {
  const totalTicks = CUR.bars * 4 * CUR.ppq;
  const horizon = ac.currentTime + 0.12;
  const loopLen = tick2sec(totalTicks);
  while (true) {
    const cycle = Math.floor(schedTick / totalTicks);
    const tickInLoop = schedTick % totalTicks;
    const evs = CUR.events.filter((e) => e.startTick === tickInLoop);
    const when = startTime + cycle * loopLen + tick2sec(tickInLoop);
    if (when > horizon) break;
    for (const e of evs) {
      const fn = KIT[e.role];
      if (fn) fn(when, Math.pow(e.velocity / 127, 1.4), tick2sec(e.durationTick));
    }
    // advance to next tick that has any event (or bar end)
    const next = CUR.events.map((e) => e.startTick).filter((t) => t > tickInLoop).sort((a, b) => a - b)[0];
    if (next !== undefined) schedTick = cycle * totalTicks + next;
    else if ($("loop").checked) schedTick = (cycle + 1) * totalTicks;
    else { setTimeout(stop, (when - ac.currentTime + 0.6) * 1000); return; }
  }
}
function animate() {
  if (!playing) return;
  const totalTicks = CUR.bars * 4 * CUR.ppq;
  const elapsed = ac.currentTime - startTime;
  const tickNow = (elapsed / tick2sec(totalTicks)) % 1 * totalTicks;
  drawGrid(elapsed < 0 ? 0 : tickNow);
  raf = requestAnimationFrame(animate);
}
function play() {
  if (!CUR) return;
  if (!ac) { ac = new AudioContext(); NOISE = noiseBuf(); }
  ac.resume();
  playing = true; schedTick = 0; startTime = ac.currentTime + 0.08;
  timer = setInterval(scheduler, 30); scheduler();
  raf = requestAnimationFrame(animate);
  $("btnPlay").textContent = "■ Stop";
}
function stop() {
  playing = false;
  clearInterval(timer); cancelAnimationFrame(raf);
  if (ac) { ac.close(); ac = null; }
  $("btnPlay").textContent = "▶ Play";
  if (CUR) drawGrid();
}

// -------------------------------------------------------------------- wiring
$("btnPlay").onclick = () => (playing ? stop() : play());
$("btnNew").onclick = () => { seed = Math.floor(Math.random() * 1e9); rerender(); };
$("btnDownload").onclick = () => apiDownload(params());
for (const id of ["preset", "bars", "bpm"]) $(id).onchange = rerender;
$("pattern").onchange = () => {
  const p = META.patterns.find((x) => x.id === $("pattern").value);
  if (p && p.bpm) $("bpm").value = p.bpm;
  rerender();
};
$("density").oninput = () => { $("densityVal").textContent = (+$("density").value).toFixed(2); };
$("density").onchange = rerender;
$("ghosts").oninput = () => {
  const v = parseFloat($("ghosts").value);
  $("ghostsVal").textContent = v < 0 ? "preset" : v.toFixed(2);
};
$("ghosts").onchange = rerender;

(async function init() {
  META = await apiMeta();
  const styles = [...new Set(META.patterns.map((p) => p.style))].sort();
  for (const style of styles) {
    const g = document.createElement("optgroup");
    g.label = style;
    for (const p of META.patterns.filter((x) => x.style === style)) {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = `${p.id}${p.bpm ? " · " + p.bpm : ""}${p.fill ? " (fill)" : ""}`;
      g.appendChild(o);
    }
    $("pattern").appendChild(g);
  }
  const firstGroove = META.patterns.find((p) => !p.fill);
  if (firstGroove) {
    $("pattern").value = firstGroove.id;
    if (firstGroove.bpm) $("bpm").value = firstGroove.bpm;
  }
  for (const name of META.presets) {
    const o = document.createElement("option");
    o.value = o.textContent = name;
    $("preset").appendChild(o);
  }
  $("preset").value = META.presets.includes("breaks") ? "breaks" : META.presets[0];
  await rerender();
})();
</script>
</body>
