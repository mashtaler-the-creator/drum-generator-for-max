name: test-build-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run validate
      - name: DRM1 library is in sync with the GM library
        run: |
          node tools/convert-to-drm1.js
          git diff --exit-code -- patterns-drm1/ \
            || { echo "::error::patterns-drm1/ is stale — run 'npm run convert:drm1' and commit"; exit 1; }
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
